# Build the Astro site and upload dist/ to Hostinger over FTP on every push to main.
#
# One-time setup (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   Secrets:   FTP_SERVER    e.g. ftp.yourdomain.com or the IP shown in hPanel
#              FTP_USERNAME  hPanel -> Files -> FTP Accounts
#              FTP_PASSWORD  the FTP account password
#   Variable (optional): FTP_SERVER_DIR  defaults to public_html/
#
# Only changed files are uploaded (a small sync-state file is kept on the server).

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
